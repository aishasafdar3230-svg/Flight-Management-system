<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wingspan | Fly Further</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Runs before React mounts / CSS paints, so a returning dark-mode user doesn't
      // see a flash of the light theme first. AuthContext takes over from here on.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("wingspan_user") || "null");
          document.documentElement.setAttribute("data-theme", saved && saved.darkMode ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
